name: CI

on:
  pull_request:
    branches: [main, stable]

jobs:
  # ---------------------------------------------------------------------------
  # Lint — flake8 (errors + undefined names) and bandit (medium/high severity)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install flake8 bandit

      - name: flake8
        run: |
          # E9 (syntax errors) and F821/F822/F823 (genuinely undefined names) only.
          # The broader F401/F541/F841/F811 etc. are cosmetic pre-existing debt across
          # a large forked codebase this repo doesn't own the style of - not something
          # this CI should gate new PRs on.
          flake8 \
            --max-line-length=120 \
            --select=E9,F821,F822,F823 \
            --exclude=.git,__pycache__,build_scripts \
            .

      - name: bandit
        run: |
          # high severity only: this is a fork of a large pre-existing codebase
          # with its own pre-existing medium-severity findings (mostly missing
          # request timeouts) this CI doesn't own responsibility for cleaning up
          # retroactively - gate new PRs on genuinely serious issues instead.
          bandit -r . \
            --exclude ./.git \
            --severity-level high \
            -q

  # ---------------------------------------------------------------------------
  # Tests
  # Install system libs your project needs before running (e.g. libegl1 for
  # PyQt6). Add QT_QPA_PLATFORM=offscreen if tests import Qt widgets.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-ci.txt
          pip install -r tests/requirements-test.txt

      - name: Run tests
        run: pytest --tb=short -q -m "not requires_audio and not requires_external_exe and not requires_llm"

      - name: No tests configured
        if: steps.check.outputs.has_requirements == 'false'
        run: echo "No requirements.txt found — skipping tests. Add requirements.txt/requirements-dev.txt and a tests/ dir to enable this job."

  # ---------------------------------------------------------------------------
  # Build — replace with your project's actual build steps.
  # Upload build artifacts with short retention so PRs are manually testable.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest  # TODO: change runner if needed (e.g. windows-latest)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

